<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Editor</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
        {% include "partials/_theme.html" %}
    </head>

    <body>
        {% include "partials/_navbar.html" %}

        <section class="section">
            <div class="columns">
                <div class="column is-2">
                    {% include "partials/_sidebar.html" %}
                </div>

                <div class="column is-10">
                    <form method="post" action="{% url 'editor' docid %}">
                        {% csrf_token %}
                        <input type="hidden" name="docid" value="{{ docid }}">

                        <div class="field">
                            <label class="label">
                                Title

                                {% if document %}
                                    <span class="has-text-grey-light">
                                        Created at: {{ document.created_at|date:"m/d Y" }} / 
                                        Modified at: {{ document.modified_at|date:"m/d Y" }}
                                    </span>
                                {% endif %}
                            </label>

                            <div class="control">
                                <input type="text" class="input" name="title" placeholder="Title"{% if document %} value="{{ document.title }}"{% endif %}>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Content</label>

                            <div class="field">
                                <textarea class="textarea" name="content" placeholder="Content">{% if document %}{{ document.content }}{% endif %}</textarea>
                            </div>
                        </div>
                        <div class="field is-grouped">
                        <div class="control">
                            <label class="checkbox">
                                <input type="checkbox" name="enable_password">
                                    Protect with password
                            </label>
                        </div>
                        <div class="control">
                        <input class="input" type="password" name="password" placeholder="Password">
                        </div>
                        </div>

                        

                        <div class="field is-grouped">
                            <div class="control">
                                <button class="button is-primary">Save</button>
                            </div>

                             {% if document %}
                                <div class="control">
                                    <a href="{% url 'delete_document' document.id %}" class="button is-danger">Delete</a>
                                </div>
                            {% endif %}
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </body>
</html>
